name: PM Workbench 云端自动更新

# 【当前状态：定时已禁用，仅保留手动触发】
# 主通道已改为「本机自动化」：由本机定时任务执行 cloud/local_run.js（0 成本，智谱国内可达）。
# 本 workflow 曾作为云端方案，但存在两个硬伤，故 schedule 段已移除：
#   1) 智谱 open.bigmodel.cn 在 GitHub 美国 runner 上不可达（3 次运行全部失败）
#   2) 账号未通过验证前，schedule 事件从未触发（8/26-9/1 共 0 次）
# 若将来账号完成验证且换成境外可达的模型，可恢复 schedule 段作为备用通道。
# 流程：checkout 主库 → 生成 → 升版本 → 测试 → git push 回主库 → 部署 GitHub Pages(pm-workbench-site)

on:
  workflow_dispatch:
    inputs:
      job:
        description: 手动触发的任务类型
        required: true
        default: daily
        type: choice
        options:
          - daily
          - news
          - reading
          - newssum
          - patrol
  # schedule 段已移除：定时任务改由本机执行，避免账号验证通过后与本机双跑、重复生成

# 回写主库需要 push 权限
permissions:
  contents: write

# 串行执行，避免并发 push 冲突
concurrency:
  group: pmwb-ci
  cancel-in-progress: false

env:
  CLOUD: "1"
  GH_REPO: "ichi010623-maker/pm-workbench-site"
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  SITE_URL: "https://ichi010623-maker.github.io/pm-workbench-site/"
  TZ: "Asia/Shanghai"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 主库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 git 身份
        run: |
          git config --global user.email "ci@pm-workbench.local"
          git config --global user.name "PM Workbench CI"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 确定任务
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "10 23 * * *") echo "job=daily"   >> "$GITHUB_OUTPUT" ;;
              "0 4 * * *")   echo "job=news"    >> "$GITHUB_OUTPUT" ;;
              "0 10 * * *")  echo "job=news"    >> "$GITHUB_OUTPUT" ;;
              "5 16 * * *")  echo "job=reading" >> "$GITHUB_OUTPUT" ;;
              "0 0 * * *")   echo "job=newssum" >> "$GITHUB_OUTPUT" ;;
              "0 */6 * * *") echo "job=patrol"  >> "$GITHUB_OUTPUT" ;;
              *)             echo "job=daily"   >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: 运行云端任务
        run: node cloud/ci_run.js ${{ steps.job.outputs.job }}

      - name: 任务
        if: always()
        run: echo "本次执行任务: ${{ steps.job.outputs.job }}"
